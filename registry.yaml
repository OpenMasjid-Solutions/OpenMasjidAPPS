# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:     <app-id>               # kebab-case, must equal the app's manifest id
#     repo:   <owner>/<repo>         # the app's own GitHub repository
#     commit: <40-char SHA>          # RECOMMENDED — an immutable commit SHA pin
#     ref:    v1.0.0                 # a git TAG or branch (MUTABLE — can be moved)
#     path:   subdir                 # OPTIONAL — if manifest.yaml isn't at the repo root
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended daily rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Complete, working reference apps live under examples/ in this repo — copy one
# into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.61.0                                 # v0.61.0 — the catalog has been rolled back to this release at the maintainer's request, so the version you see goes DOWN from v0.65.0. The Raspberry Pi display node feature (v0.62.0–v0.65.0) is withdrawn: if you set up a Pi node it will stop being managed, and that screen should go back to an RTSP decoder pointed at its link. Timetables, cameras, HDMI sources, schedules and the volunteer page are untouched, and nothing you set up before v0.62.0 needs redoing. Release line; commit (below) is the immutable pin (v0.61.0: salah hadith shows ONE per prayer — salah-specific ones at their salah — with Arabic & English together)
    commit: 254b4e1768b80e0b8aaf3f32b737fc837424f58c
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.40.0                                 # v0.40.0 — the app now tells you when it has something to tell you. OpenMasjidOS updates your apps quietly in the background, so nothing ever said that the donations panel had changed under you: after an update there is a small gold dot on your account button (top right), and it goes as soon as you have opened “What’s new”. Those notes read better too — each change leads with what it is, then the detail behind it, and every release now shows the date it came out — and they are laid out the same way as the notes in OpenMasjid Kiosk, so the two apps read alike. Fixed: the notes could open underneath the row of buttons at the foot of the screen, which covered their last few lines. Nothing about how you take donations changes, and nothing you have set up needs redoing. Plus everything from v0.39.0 — a safety review of the whole app, plus one thing that puts money back in your records. If a donor’s card went through but their page never finished loading — they closed the tab, or the wifi dropped at the wrong second — the money was taken and nothing here ever knew about it. Those donations are now found and added by themselves, with the date they actually arrived, and the donor is sent the receipt they never got. So expect your totals to go up the first time this runs: that is money that already reached your bank, and your records simply didn’t know. If you have already filed accounts or a Gift Aid claim on the old figures, look at the new ones before you rely on them. The app also now keeps a record of the things worth being able to check later — who exported the donor list, who paused or stopped a monthly plan, who changed the Stripe keys, and when. And a number of quieter repairs: your donor records are kept out of every cache so an export can’t be left sitting anywhere it shouldn’t, signing in is protected properly when your site is served over HTTPS, the pages that talk to OpenMasjidOS can no longer be flooded by someone on your network, and a donor’s name can no longer interfere with the receipt email it appears in. Nothing about how you take donations changes, and nothing you have set up needs redoing. Plus everything from v0.38.0 — a new Monthly tab puts every donor who gives every month in one place. Each plan shows who set it up and how to reach them, how much and how often, which appeal it goes to, what it has given so far, when they last paid, when the next payment is due, and which card it is on. Open one and you can pause it — nothing is taken from the donor’s card while it is paused, and the months missed are never billed to them afterwards — start it again, or stop it for good. You can also say when a plan should end: on a day you choose, or after a set number of further payments, and it tells you in plain words which payment will be the last one before you save. Every plan keeps its own payment history, so a card that was declined reads as a sentence you can act on rather than a code, and you can see how many times it was tried. One thing worth knowing before you open it. After a donor’s first monthly payment, the ones that followed were only written into your records if you had set up a Stripe webhook — something most masjids never did, because it needs your donation page to be reachable from the internet. Those payments are now picked up by the app itself, each with the date the money actually arrived, so your donations list, your CSV export and your charts include every month. If you have been taking monthly gifts for a while, expect those totals to grow the first time you look: that money did reach your bank, your records simply didn’t know about it. Donation and Zakat pages, tuition, Gift Aid, receipts and thank-you messages are all untouched. Plus everything from v0.37.0 — the tuition page is now laid out child by child: each child has their own line with what they owe or have paid ahead, their own bills beneath it, and their own “Add money” button. That last part matters — money paid ahead now goes to the child you picked, so it lands on their account instead of settling a brother or sister’s older bill. A child with nothing due says so rather than disappearing from a page that only listed debts. Bills also read as a statement until you choose to pay part of one: the tick boxes only appear after you tap “Choose what to pay”, and each bill is its own card with its lines indented under it, so a month reads as one thing. Plus everything from v0.36.0 — a tuition bill can be paid line by line. A February bill is often £200 of monthly tuition plus a £50 book fee, and until now a parent could only pay the whole £250; the page now lists what a bill is made of and they can pay just the book fee. Lines already paid say so, and a bursary shows as the deduction it is — both there for information, neither payable. Everything starts ticked, so paying a whole bill is still one tap, and the running total sits on the pay button. A bill with a single line looks exactly as it did. There is also a new “What’s new” in the account menu (top right): after an update it tells you what changed, and it works with no internet since the notes ship with the app. Needs OpenMasjid Students v0.43.0 for itemised bills; older versions keep paying each bill as one thing. Plus everything from v0.35.0: paying tuition ahead when nothing is due, with any credit on the account shown instead of a bare zero, and a £1/$1 minimum matching the school’s own portal; from v0.34.0: a chosen month lands on the right child’s bill; and from v0.33.0: tuition takes only the child’s Student ID with the name shown back to confirm. Donation and Zakat pages, Gift Aid, receipts and your donation totals are untouched. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 308e0339bc278cdd59db81fc34db0c69a8bc142f
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.10.1                                 # v0.10.1 — security update, please install. If you had turned on Remote access in OpenMasjidOS AND “Allow remote adoption” in the kiosk, the rule that keeps this app’s admin side on your own network could be stepped around by writing part of the web address a different but equivalent way. Your admin password was still required, so nobody could see donations, donors or plans without it — but the sign-in page itself was reachable from the internet, and it never should have been. That is closed, with a test that keeps it closed. If you use remote adoption, change your kiosk admin password after updating; if you have never turned it on, you were never affected. Also new: an activity record for the actions that reach outside the app — cancelling, pausing or rescheduling someone’s monthly donation, removing a kiosk, changing the exit PIN — so that when two people share the admin login you can still tell who stopped a donor’s standing order, which Stripe alone can never tell you. The typed-card screen can no longer be navigated away to anything but Stripe, so a locked kiosk cannot be turned into a web browser; card authentication with the donor’s bank is unchanged. Pairing a tablet is now protected against guessing from many devices at once, not just one. Underneath: the web-serving library is updated to close four published vulnerabilities, every other known advisory in both halves of the app is cleared, and each build step is pinned to an exact verified version so the app you install is the app we built. Nothing about how the kiosk looks or behaves for a donor changes. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 1c9f3c55a684ff583b41851c76b76b12e9a24374   # immutable pin; the app's compose pins the @sha256 image digest
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.45.1                                 # v0.45.1 — the security release below, plus the notes themselves. What’s new only ever displayed text written as a bullet point, so any plain paragraph in the release notes was quietly dropped on the way to the screen: the summary at the top of the 0.45.0 entry, the note explaining that 0.36.0’s features arrived with no screens to reach them by, the whole of the 0.1.0 entry, and a correction published against the 0.36.0 notes that existed precisely to say what that release had really delivered. All of it is readable now. Nothing about the app itself changes from 0.45.0 — if you are already on 0.45.0 this only fixes what you can read. FROM 0.45.0, the release it carries: changing your password now signs you out on your other devices (resetting a forgotten one always did; changing a known one did not, so a parent who signed in on a borrowed phone and later changed their password from home left that phone signed in for up to another twelve hours — the device you change it on stays signed in). Accepting a parent-portal invite no longer leaves the family on a blank page: they were signed in correctly and then sent somewhere else entirely, so the reasonable conclusion was that signing up had failed, and it was the first step for every family who joins by invite. Generating a month’s invoices no longer gets slower every year — balances, the year-grid ticks and the order money lands in are unchanged. The app no longer ships a mail library it never used and could never have sent with, in which eight security problems had since been found, nor a leftover PDF component from the old report cards. Printed family statements, which carry every child’s Student ID and the household’s payment history, are served locked down. And the release process is harder to tamper with: every build step pinned to an exact verified version so the app you install is the app we built, five shared components updated to close published vulnerabilities, and all 527 automatic checks now run before any release can ship. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 5bf601dc49220a6398ebd8e5d7210c7e2078d83b
