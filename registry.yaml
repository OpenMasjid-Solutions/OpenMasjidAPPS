# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:     <app-id>               # kebab-case, must equal the app's manifest id
#     repo:   <owner>/<repo>         # the app's own GitHub repository
#     commit: <40-char SHA>          # RECOMMENDED — an immutable commit SHA pin
#     ref:    v1.0.0                 # a git TAG or branch (MUTABLE — can be moved)
#     path:   subdir                 # OPTIONAL — if manifest.yaml isn't at the repo root
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended daily rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Complete, working reference apps live under examples/ in this repo — copy one
# into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.65.0  # v0.65.0 — Raspberry Pi display nodes: a small Pi plugged into the TV draws the timetable itself and plays cameras straight off the network, so the server does no video work for that screen. Opt-in in Settings; existing RTSP decoder screens are unchanged. commit below is the digest-pin that follows the tag; the app's compose pins the @sha256 image digest.
    commit: a32816bf5e3e3576b4a0bcfb400713b12383e98f
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.32.0                                 # email receipt design on the Thank-you tab; enable toggle + "send me a test" (reaches the admin via the alert channel) in Settings; commit below is the immutable pin (@sha256 image digest)
    commit: f4ceef1bd529a8309a4acd05e95b779b3a2a1c98
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.9.29                                 # v0.9.29 — tuition at the kiosk now asks for the child’s Student ID (e.g. YUS1234) and nothing else: the screen shows the child’s name back and waits for a “yes” before any balance appears, so a mistyped ID is caught instead of paying a stranger’s bill. No PIN to remember or reissue. With OpenMasjid Students billing each child separately, paying a specific month now lands on that child’s bill, and every month listed says whose it is. Needs OpenMasjid Students v0.39.0 and a tablet app update — the new app is on the kiosk’s own setup page. Donations, Zakat, the card reader and receipts are untouched. Plus everything from v0.9.27: the soft-kiosk lockdown (held screen pinning that blocks the shade and recents, swallowed Back, in-app app updates with no browser). One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 24138944bfa47ef5c1477ec43f0a66b5306cb9f2   # immutable pin; the app's compose pins the @sha256 image digest
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.39.0                                 # v0.39.0 — paying tuition now takes ONLY the child’s Student ID (e.g. YUS1234): type it, check the name the screen shows back, then pay for any of your children from that one screen. PINs are gone, so there is no second number to remember and nothing to reissue when a parent forgets one — a name-confirmation step and a hard per-ID lockout protect it instead. One bill per child: each child has their own invoices, balance, credit and payment history, and recording cash asks which child it was for — while parents still see one combined balance and pay once. Adding people starts with the student: pick a brother or sister already enrolled and the guardian details already on file apply to them; nobody names a household any more. Plus everything from v0.38.0: automatic monthly invoices, CSV export, the Structure tab (school year, terms, courses → classes), per-student fee overrides and the whole-year payment grid. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    # Heads-up for whoever ships the next Donations release: v0.39.0 moved the students/billing
    # Fabric contract to v: 2 — `lookup` takes the Student ID alone. Kiosk shipped its v2 screen
    # in v0.9.29 (identify → confirm the name → lookup, plus the per-child split on
    # record-payment, which is what 0.39.0 actually books the ledger from). Donations still sends
    # the old name+PIN body and gets a 400 on that one call (its money path is untouched), so its
    # v2 lookup screen is the remaining follow-up.
    commit: cb23c66feb04afd8c3cd3cdc3ded42fbde5990f3
  - id: parking-attendant
    repo: SyButter/OpenMasjidParkingAttendant
    ref: v0.2.1                                  # v0.2.1 — one-click install + OpenMasjidOS SSO; live board + incorrect-parking alert cards (with the car's photo) that Display can cycle as announcements; per-plate offender strikes; SQLite on /data
    commit: 2cd04c58cdc25f5714f956ef6bbe517be3d062a5   # immutable pin (the v0.2.1 tag commit)
  # Example (uncomment and adapt once the app repo exists):
  # - id: prayer-times-display
  #   repo: OpenMasjid-Solutions/openmasjid-prayer-times-display
  #   ref: v1.0.0
