# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:      <app-id>              # kebab-case, must equal the app's manifest id
#     repo:    <owner>/<repo>        # the app's own GitHub repository
#     ref:     v1.0.0                # STABLE channel — the published release TAG
#     commit:  <40-char SHA>         # RECOMMENDED — the immutable SHA that tag is at
#     dev_ref: dev                   # OPTIONAL — DEV channel; a branch (moves)
#     path:    subdir                # OPTIONAL — if manifest.yaml isn't at the repo root
#
# TWO CHANNELS, ONE SCHEMA. OpenMasjidOS has an Update Channel setting that swaps the
# branch in the raw URL it fetches, so each branch of this repo publishes its own
# catalog.json: `main` = stable, `dev` = development. This file is identical on both
# branches and carries BOTH addresses per app; the branch being built decides which
# column is used (`ref`/`commit` on main, `dev_ref` on dev). An app with no `dev_ref`
# still appears on the dev channel — it falls back to its stable release, with a
# build notice. A dev ref or a dev-tagged image can never be published on main: the
# build fails loudly. See CLAUDE.md "Channels".
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended daily rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# `ref:` is the STABLE column and must be a published release tag (or a SHA) — never
# a branch; the build rejects one. `dev_ref:` is the only place a branch belongs, and
# it is a moving ref on purpose: the daily rebuild follows it, which is the point of
# a dev channel. (It may also be a 40-char SHA if you want to freeze the dev channel.)
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Skeletons showing the shape an app repo needs live under examples/ in this repo —
# illustrative scaffolding, not maintained software; copy one into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.68.0                              # v0.68.0 — the prayer times on your timetable screens are a little larger. The Adhan and Iqamah times are set about a tenth bigger than before, so they read more easily from the back of a hall; the prayer names, the columns and everything else on the screen are exactly as they were, and it applies to all three layouts. Nothing to set up and nothing needs redoing. Plus everything from v0.67.0 — the app now tells you what changed: OpenMasjidOS updates your apps quietly in the background, so nothing in the panel ever said the app had changed under you, and the account button (top right) now opens What's new, the release notes for the version you are actually running, readable with no internet because they ship inside the app. The “Iqamah times are changing” reminder is also far harder to miss: it used to be a quiet line in your own colours, and it is now red and sits in the bottom band beside your scrolling announcements behind a clear divider (turn announcements off and it takes the whole strip). Nothing above it shrinks any more, it stays up while announcement pictures are cycling, and the prohibited-time (zawal) message still keeps the strip to itself. Two fixes worth naming from that release: Arabic and Urdu text could come back with one character replaced by a black diamond after a long save, and a camera link starting rtmp:// could be saved and then never play. One-click install; commit below is the immutable pin, and the app's compose pins the @sha256 image digest
    commit: 0b708766cc9e0e37ddb6a970c10f130c94f81c1b
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.42.0                                 # v0.42.0 — three things you can do now that you could not before, and one that was quietly broken. You can refund a donation from the panel. Open any donation in the Donations tab and send back all of it or part of it, with a reason, and — if the supporter left an email — a note telling them it is on its way. Refunded gifts are marked in the list and come off your totals, your charts and your appeal progress bars, so what you see raised is what you actually kept, and a refund you make in Stripe’s own dashboard finds its way here too. Monthly donors are now emailed their own link to stop their payments. When someone sets up a monthly gift they get a confirmation of what they have arranged — the amount, the fund, the date of the first payment — with a link they can use at any time to stop it themselves: no account, no password, nobody to ring. The email asks them to keep it safe, since the link lives only there, and if they lose it you can still stop the gift from the Monthly tab in a moment. You are told whenever a donor uses their link, so a stopped gift is never something you discover a month later. Each appeal can now pay into its own Stripe account, so Zakat can settle somewhere separate from the general fund — you choose it per appeal on the Campaigns tab, either an account set up in OpenMasjidOS or one whose keys are on this device. Nothing changes unless you change it: every appeal you already have carries on paying into exactly the account it always has, and if an appeal’s chosen account ever becomes unavailable that page stops taking cards and tells you plainly rather than quietly sending the money somewhere else. And fixed: your emailed receipts were never actually branded. If you had receipts turned on and had designed one on the Thank-you tab, donors were still sent your card processor’s plain receipt instead — so everyone always got a receipt and nothing looked wrong, but it was never yours. Your own design goes out from now on. A full security and code-health review also went over the whole app, including the three new features; it found no new weakness, and what it did find and what is still open are written up in the project’s own docs. Nothing you have set up needs redoing, and your donations, appeals and monthly plans are all exactly as they were. Plus everything from v0.41.0 — the new square Donations logo, so the App Store tile, your browser tab and the mark in the panel are all the same picture, drawn rather than photographed so it stays sharp at every size. Plus everything from v0.40.1 and v0.40.0 — a development channel if you ever want one (stable is the default and is the one to stay on for taking real donations), and a “What’s new” that tells you when there is something new: a small gold dot on your account button after an update, gone as soon as you have read the notes. Plus everything from v0.39.0 — donations that were paid but never landed in your records are found and added by themselves, so expect your totals to go up the first time that runs; that is money which already reached your bank. Plus the Monthly tab from v0.38.0, and the tuition improvements from v0.33.0 through v0.37.0. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 1e3ea9e81d6fd454d513fe2d7ac91434f8d80f10
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.11.0                                 # v0.11.0 — monthly giving works properly for the first time, and you can now refund a donation from the admin panel. Update your tablets after installing; several of these fixes live in the tablet app. Monthly was the big one: every monthly gift, on every card and every reader, took the money and never set up the standing order, so a donor told their monthly giving was arranged before this release was charged once and nothing recurs. It now works end to end, on the reader and on typed cards, and the donor is emailed when it starts with their own “Stop my monthly donation” link that works from anywhere — press it and you get an alert, and a link for a donation that has already stopped says so rather than offering a button that would do nothing. Refunds: open any donation and give back all or part of it with a reason recorded in Stripe — the donor gets a branded refund note if they left an email, you get an alert, and every total is netted so today, this week, this month and all time show what the masjid actually kept. The card reader now works for appeals that settle to a second Stripe account, which also makes monthly giving possible on them for the first time, and a monthly plan can no longer go missing from the Recurring page. On the tablet: Android Settings, the permission buttons and the self-updater all work on a locked kiosk again (screen pinning is gone — it was silently blocking them), updating the app no longer needs a browser, payments no longer fail to start on a slow connection, the card step can show a pointer to whichever edge your reader is mounted on, and a reader firmware update is shown on the giving screen so an updating reader no longer looks like a broken one. Also: the campaign editor is a full page in its own browser tab, campaign colours accept a typed hex code, campaign tabs have an adjustable size, and monthly plans are no longer set up as a “free trial”. Security: no other site can load this app inside a frame, closing the last item left open by the August security audit. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: b4ef5ade4487d8ab3dc5edd5db4409b125fb460e   # immutable pin; the app's compose pins the @sha256 image digest
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: openwa
    repo: OpenMasjid-Solutions/OpenMasjidWA
    ref: v0.1.1                                  # v0.1.1 — a WhatsApp number the masjid can send from. This is a transport, not something a volunteer opens day to day: OpenMasjidOS keeps ONE paced send queue for the whole masjid and asks this gateway to send, so the apps that have something to say (the madrasah app first) ask OpenMasjidOS, and nothing else in the masjid talks to WhatsApp directly. No app ever sees this gateway's key. Read the warnings before linking a number, because they are real and they are not ours to soften: this is an UNOFFICIAL WhatsApp client, the linked number CAN be restricted or banned, and a masjid should link a DEDICATED number it can afford to lose — never the masjid's main line. It is also a heavy app. The safer of its two engines works by running a real headless Chromium, which is exactly why WhatsApp finds it harder to tell from a person, and it costs roughly 300-500 MB of memory continuously for as long as the number stays linked; on a 2 GB Raspberry Pi budget for that before installing. The lighter engine (baileys, ~30-80 MB) is offered as a setting and carries a HIGHER ban risk, which the install dialog says plainly. Setting it up is one install, then one detour: OpenWA cannot create OR start a session from configuration and its session id is a UUID it mints itself, so the admin opens this app once, creates a session, presses Start, presses View and copies the full Session ID into OpenMasjidOS > Settings > WhatsApp — after which linking the number, and everything else, happens in OpenMasjidOS. The Start click is not optional and v0.1.1 exists because the first instructions left it out: a created-but-not-started session refuses to link and the only thing the admin sees is "gateway returned 400". Kept on the masjid's own network on purpose: it holds a live, logged-in WhatsApp session, so it is deliberately NOT offered over the internet. This repo is PACKAGING ONLY — the software is OpenWA by rmyndharis (MIT), run unmodified; upstream's own compose cannot be catalogued because it builds from source, mounts the host Docker socket and attaches to pre-existing volumes and networks. Commit below is the immutable pin, and the compose pins the @sha256 image digest (multi-arch: amd64 + arm64)
    commit: a900adffa35da1f6fe7bd8e7899226ea396739b6
    dev_ref: dev                                 # dev channel — a scheduled job follows upstream OpenWA releases onto this branch; stable is promoted by hand
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.49.0                                 # v0.49.0 — What's new now shows the headlines of a release rather than every detail that went into it, so an update tells you the handful of things that changed for you; the full notes are still in the changelog. ALSO ARRIVING WITH THIS UPDATE, from v0.48.0: refund any payment from the bottom of Billing, card or cash, with each row telling you which of the two it will be before you press — a card goes back through Stripe, cash is put right on the ledger for you to hand over. Every payment record now says what the money was FOR, not just how it arrived. Setting up is one guided pass — the school year and its terms, classes, fee plans, payments, email, staff, then your students from a spreadsheet (.xlsx now, not only CSV) — and starting a new school year is a proper handover that promotes classes and carries children forward, with the plan shown before anything moves. On a phone it installs to the home screen with your own logo and your madrasah's name, no address bar. Parents can add a bank account, put their saved payment methods in the order they should be charged, and see their whole year at a glance. Past-due reminders reach you as one digest and, if you switch it on, families as one reminder per household. Plus a security review of the whole app: sign-in attempts against one account are now capped and alerted, staff usernames can no longer differ only by capital letters, and dates on the money path are checked so an empty date box can no longer answer with a database error. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 222f06406183889ab2c40b95a9612dc5bcc05c67   # immutable pin; the app compose pins the @sha256 image digest
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
