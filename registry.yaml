# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:      <app-id>              # kebab-case, must equal the app's manifest id
#     repo:    <owner>/<repo>        # the app's own GitHub repository
#     ref:     v1.0.0                # STABLE channel — the published release TAG
#     commit:  <40-char SHA>         # RECOMMENDED — the immutable SHA that tag is at
#     dev_ref: dev                   # OPTIONAL — DEV channel; a branch (moves)
#     path:    subdir                # OPTIONAL — if manifest.yaml isn't at the repo root
#
# TWO CHANNELS, ONE SCHEMA. OpenMasjidOS has an Update Channel setting that swaps the
# branch in the raw URL it fetches, so each branch of this repo publishes its own
# catalog.json: `main` = stable, `dev` = development. This file is identical on both
# branches and carries BOTH addresses per app; the branch being built decides which
# column is used (`ref`/`commit` on main, `dev_ref` on dev). An app with no `dev_ref`
# still appears on the dev channel — it falls back to its stable release, with a
# build notice. A dev ref or a dev-tagged image can never be published on main: the
# build fails loudly. See CLAUDE.md "Channels".
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended hourly rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# `ref:` is the STABLE column and must be a published release tag (or a SHA) — never
# a branch; the build rejects one. `dev_ref:` is the only place a branch belongs, and
# it is a moving ref on purpose: the hourly rebuild follows it, which is the point of
# a dev channel. (It may also be a 40-char SHA if you want to freeze the dev channel.)
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Skeletons showing the shape an app repo needs live under examples/ in this repo —
# illustrative scaffolding, not maintained software; copy one into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.70.0                              # v0.70.0 — the Raspberry Pi release. A cheap Raspberry Pi behind a television is now a full screen: it draws the prayer timetable itself with no desktop and no browser, and it opens your cameras directly on your own network, so camera video never travels through the display server — which is what lets the server sit in another building, or in the cloud, while cameras stay smooth. One command sets a Pi up, a code appears on the television, and you type it into the dashboard. It keeps itself up to date, keeps your wallpaper, logo and announcements on the Pi so a screen survives losing the network, renders Arabic properly, and uses the masjid's clock rather than the Pi's. Everything about a Pi screen is then managed from the dashboard: watch what it is showing right now as a live picture read out of the screen's own video memory — the only answer to "is that screen really showing today's times?" that does not depend on the screen agreeing that it is; turn the television off on demand or on a schedule each night; set the screen's timezone, which is the one setting that silently puts every prayer time an hour out; force a resolution for a television that negotiates a bad one, with an automatic revert if the picture does not come back; reboot it, nightly at 3am by default; join it to Wi-Fi; update the system packages and the app together with one button; read a screen report with load, memory, temperature and a plain warning when the power supply is not keeping up; and open a console or a full terminal. The terminal is a root shell, deliberately, so a screen in another city can actually be fixed — nothing connects to a Pi, it dials out, the one-time code never reaches a browser, and the server expires the session. A Pi 4 or newer is required; a Pi 3 screen already on a wall keeps working. Browser screens (beta) now play cameras and HDMI sources too, and there is a second screen design, Simple — a plain flat page with a logo, clock and date column beside one banded prayer table — beside the themed one, now called Modern. Your prayer times are also offered to the other OpenMasjid apps on your box, read-only and never leaving it, so OpenMasjid Companion can show musallis the same Adhan and Iqamah times as the wall — with every scheduled change already applied — and use your masjid's logo as its icon instead of being told the times a second time and drifting. Fixes worth naming: prayer times were an hour wrong for the two hours before the clocks changed, on both of those nights a year; the printable month calendar ignored scheduled Iqamah changes entirely, so a masjid that had scheduled one printed the old times indefinitely; the website widget showed two different times for the same prayer; and two Raspberry Pi privilege flaws plus one control-panel authentication flaw were closed. One-click install; commit below is the immutable pin, and the app's compose pins the @sha256 image digest
    commit: e43f9d60587ee1cad5cb3c635299cb5c79178429
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.44.0                                 # v0.44.0 — tell as many people as you like, and choose what each of them hears about. Settings then Notifications is now a grid: add an email address or a WhatsApp number, then tick the things that person should be told about — a donation arriving, a refund, a monthly donor stopping, donations breaking altogether, a tuition payment that did not reach OpenMasjid Students, or a donation that was found and added. So refunds can reach whoever keeps the accounts while a broken payment setup reaches whoever fixes things, and the treasurer does not have to read about every gift to hear about the one that came back. Before this you could name one address and one number per alert. Adding somebody grants them no access to the app whatsoever — it is an address on a list, not an account — and alerts can name an appeal and an amount but never a donor, so nobody you add ever learns who gave. WhatsApp is kept separate from the email list on purpose, and nothing is ever switched on for you: it sends from your masjid's own linked number, that number is shared with every other app on your server, and if WhatsApp ever blocks it nobody can undo that. Every box on the WhatsApp grid starts empty until you tick it, and the app holds itself to about twenty messages an hour to any one number and forty an hour in total. Phone numbers are now entered with the country picked from a list and format themselves as you type — choose US / CA (+1), type 3135550142, and the field shows (313) 555-0142. That fixes something worth being straight about: a number typed as ten digits with no country code used to be accepted and sent to the wrong country entirely, with nothing on screen looking wrong. A number you already saved still works and needs no attention. Every notification now says which appeal it was about, and when the app finds donations that were paid but never recorded it breaks them down by appeal so you can see which fund went up rather than only how much. If WhatsApp ever stops delivering without saying so you will now be told, and told which of four things went wrong. Nothing is lost when that happens — every donation, refund and monthly change from that period is in your records exactly as it should be; it was only the notifications that went missing, and they are deliberately not re-sent, because a burst of old messages to a phone you have only just reconnected is the quickest way to get that number blocked. Fixed: a bad afternoon could bury you in identical messages. If your card keys expire or Stripe has an outage, every person who tries to give fails and you were told about each one; you now get the first straight away and the next an hour later saying how many times it happened in between. If you run a school and use OpenMasjid Students you can now ask parents to cover the card fee, off unless your school switches it on, with the child's balance still going down by the tuition rather than the total. The smallest-amount box beside “a donation was received” has gone: who hears about a donation is now a tick per person, so the treasurer can be left off it entirely rather than given a threshold. Wording is now American English throughout and amounts show in dollars by default; your own wording, appeals and currency setting are untouched. A full security and code-health review went over all of the above. It found no new weakness, and it caught one fault in the new notification grid before any masjid saw it: adding a WhatsApp number worked, but ticking any of its boxes silently failed. That is fixed and checked against a running copy of the app. Nothing you have set up needs redoing, and your donations, appeals and monthly plans are all exactly as they were. Plus everything from v0.43.0 — WhatsApp notifications and the !donations figures you can ask for by message. Plus everything from v0.42.0 — refunds from the panel, monthly donors emailed their own link to stop their payments, and each appeal able to pay into its own Stripe account. Plus everything from v0.39.0 through v0.41.0 — donations that were paid but never landed in your records found and added by themselves, a development channel, and the new square Donations logo. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 487f7a09460cf0a6a75576394be7ae252bc753ed
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.12.0                                 # v0.12.0 — choose exactly who hears about what, take donations on a phone at events, and a serious refund fix. PLEASE READ THE REFUND ONE: on 0.11.0, refunding PART of a donation gave back a hundredth of what you typed — typing 50 on a $100 donation refunded 50 cents, and the hint underneath told you to type 10000 instead. Full refunds were never affected and donations themselves were never affected, but it is worth checking any partial refund you have given; three-decimal currencies (Kuwaiti, Bahraini, Omani) were out by a thousand. Settings → Notifications is now one table: add the people who should hear from your kiosks — a treasurer, a caretaker, a trustee — and tick what each of them gets, by email or WhatsApp, as many as you need. You can send to a WhatsApp GROUP, which reaches everyone in it with one message, and you decide per group whether a donor's name travels with the alert (off by default, because everyone in a group can see every other member's number). You set the WhatsApp limits yourself, per hour and per day. Every address you already had is carried over subscribed to exactly the alerts it was on, so there is nothing to do after updating. NEW SECOND APP: OpenMasjid Mobile Donations, for a volunteer's own phone at a fundraiser — open /new on the phone, download, pair with a 6-digit code, take cards on a Stripe Reader M2 over Bluetooth or USB. It does not lock the phone down; Home and Back keep working. With Remote access on, a volunteer can set their phone up from anywhere without joining the masjid's Wi-Fi. Notifications now name which appeal a donation was for, including the ones that report a problem — which matters when an appeal settles to its own Stripe account and can break while everything else is fine. Fixed: the card reader could stop connecting after you changed your Stripe account, with nothing on any screen explaining why and nothing you could clear — an affected kiosk now repairs itself. Also: a properly light light mode, ask your kiosks how they are doing over WhatsApp (!kiosk — read-only, no donor details, refused from the internet), a school can ask the payer to cover the card fee (needs OpenMasjid Students 0.51.0, off unless the school turns it on, and the ledger is still credited the tuition never the total), and the kiosk now tells you if a WhatsApp alert may not have reached you. UPDATE YOUR TABLETS after installing — several fixes live in the tablet app, including the card-reader one. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 2185413c4c07ed20eaca018cda28869467ca213b   # immutable pin; the app's compose pins the @sha256 image digest
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: openwa
    repo: OpenMasjid-Solutions/OpenMasjidWA
    ref: v0.2.0                                  # v0.2.0 — a WhatsApp number the masjid can send from. This is a transport, not something a volunteer opens day to day: OpenMasjidOS keeps ONE paced send queue for the whole masjid and asks this gateway to send, so the apps that have something to say (the madrasah app first) ask OpenMasjidOS, and nothing else in the masjid talks to WhatsApp directly. No app ever sees this gateway's key. Read the warnings before linking a number, because they are real and they are not ours to soften: this is an UNOFFICIAL WhatsApp client, the linked number CAN be restricted or banned, and a masjid should link a DEDICATED number it can afford to lose — never the masjid's main line. It is also a heavy app. The safer of its two engines works by running a real headless Chromium, which is exactly why WhatsApp finds it harder to tell from a person, and it costs roughly 300-500 MB of memory continuously for as long as the number stays linked; on a 2 GB Raspberry Pi budget for that before installing. The lighter engine (baileys, ~30-80 MB) is offered as a setting and carries a HIGHER ban risk, which the install dialog says plainly. Setting it up is one install, then one detour: OpenWA cannot create OR start a session from configuration and its session id is a UUID it mints itself, so the admin opens this app once, creates a session, presses Start, presses View and copies the full Session ID into OpenMasjidOS > Settings > WhatsApp — after which linking the number, and everything else, happens in OpenMasjidOS. The Start click is not optional and v0.1.1 exists because the first instructions left it out: a created-but-not-started session refuses to link and the only thing the admin sees is "gateway returned 400". Kept on the masjid's own network on purpose: it holds a live, logged-in WhatsApp session, so it is deliberately NOT offered over the internet. This repo is PACKAGING ONLY — the software is OpenWA by rmyndharis (MIT), run unmodified; upstream's own compose cannot be catalogued because it builds from source, mounts the host Docker socket and attaches to pre-existing volumes and networks. v0.2.0 brings the gateway itself up to OpenWA 0.21.0, three upstream releases on, and carries the two fixes the development channel has been running since: the setup steps now include the Start click, without which a session refuses to link and the admin only ever sees "gateway returned 400"; and WhatsApp privacy ids (@lid), which carry no phone number, are resolved back to a number so admin commands can match the sender against the authorised list. Nothing a masjid has set up needs redoing — the linked number, the gateway key and the session all survive an app update. Commit below is the immutable pin, and the compose pins the @sha256 image digest (multi-arch: amd64 + arm64)
    commit: c298082b3044df1242a9bb6a0ce84a3d8d7051a3
    dev_ref: dev                                 # dev channel — a scheduled job follows upstream OpenWA releases onto this branch; stable is promoted by hand
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.51.0                                 # v0.51.0 — You can now ask parents to cover the card processing fee instead of the madrasah absorbing it: every card payment costs you about 2.9% plus 30¢, so a $100 bill has always brought in $96.80 — switch this on and the payer is charged $103.30 and you receive the full $100. It arrives OFF, it never touches cash or checks, bank payments have their own much cheaper rate and their own switch, and the fee is shown to a parent on its own line before they pay, on the autopay tab, and on the printed family sheet, each time saying plainly that the money is the card networks' and not yours. WhatsApp messages now tell you whether they actually arrived rather than stopping at “Queued”, and there are no more quiet hours — a declined card on a Sunday evening reaches a treasurer's phone that evening. The office can record that a parent does not want WhatsApp, because parents say that at pickup and not by signing into a portal. Payment notices to your own notification channel can name the child (off until you turn it on, admin only, and payment notices only). “Which month?” is a dropdown everywhere it is asked, so a typo can no longer put a charge on a month you never bill. A test WhatsApp says which phone it went to. The screens that scroll are faster. And the app writes American English throughout. TWO FIXES WORTH KNOWING: a month you voided can now be billed again — it could not be, so voiding a bill to correct it left that child unbillable for that month for good, and any one-off charge on it quietly stopped being owed. And per-term fee plans are not billed by this app: the cadence can be chosen but invoices are generated by month, so if you have per-term plans configured, check whether you have been invoicing them — the app now says so on the fee-plan form and leaves those fees out of the year figure instead of quoting money it will not collect. ALSO: a family who always pays by cash or transfer can be recorded automatically on a day you choose; a full-year fee quote per child; a mid-year joiner's first month set to whatever you agreed; erasing a billed student for good behind a door that asks for their name; one onboarding message that explains what the portal is; and a Billing button on every child in a family's record. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 6cc56db3f2383723fa25f2d4132f31284148c96c   # immutable pin; the app compose pins the @sha256 image digest
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
