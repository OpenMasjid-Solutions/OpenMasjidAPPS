# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:     <app-id>               # kebab-case, must equal the app's manifest id
#     repo:   <owner>/<repo>         # the app's own GitHub repository
#     commit: <40-char SHA>          # RECOMMENDED — an immutable commit SHA pin
#     ref:    v1.0.0                 # a git TAG or branch (MUTABLE — can be moved)
#     path:   subdir                 # OPTIONAL — if manifest.yaml isn't at the repo root
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended daily rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Complete, working reference apps live under examples/ in this repo — copy one
# into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.65.0  # v0.65.0 — Raspberry Pi display nodes: a small Pi plugged into the TV draws the timetable itself and plays cameras straight off the network, so the server does no video work for that screen. Opt-in in Settings; existing RTSP decoder screens are unchanged. commit below is the digest-pin that follows the tag; the app's compose pins the @sha256 image digest.
    commit: a32816bf5e3e3576b4a0bcfb400713b12383e98f
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.39.0                                 # v0.39.0 — a safety review of the whole app, plus one thing that puts money back in your records. If a donor’s card went through but their page never finished loading — they closed the tab, or the wifi dropped at the wrong second — the money was taken and nothing here ever knew about it. Those donations are now found and added by themselves, with the date they actually arrived, and the donor is sent the receipt they never got. So expect your totals to go up the first time this runs: that is money that already reached your bank, and your records simply didn’t know. If you have already filed accounts or a Gift Aid claim on the old figures, look at the new ones before you rely on them. The app also now keeps a record of the things worth being able to check later — who exported the donor list, who paused or stopped a monthly plan, who changed the Stripe keys, and when. And a number of quieter repairs: your donor records are kept out of every cache so an export can’t be left sitting anywhere it shouldn’t, signing in is protected properly when your site is served over HTTPS, the pages that talk to OpenMasjidOS can no longer be flooded by someone on your network, and a donor’s name can no longer interfere with the receipt email it appears in. Nothing about how you take donations changes, and nothing you have set up needs redoing. Plus everything from v0.38.0 — a new Monthly tab puts every donor who gives every month in one place. Each plan shows who set it up and how to reach them, how much and how often, which appeal it goes to, what it has given so far, when they last paid, when the next payment is due, and which card it is on. Open one and you can pause it — nothing is taken from the donor’s card while it is paused, and the months missed are never billed to them afterwards — start it again, or stop it for good. You can also say when a plan should end: on a day you choose, or after a set number of further payments, and it tells you in plain words which payment will be the last one before you save. Every plan keeps its own payment history, so a card that was declined reads as a sentence you can act on rather than a code, and you can see how many times it was tried. One thing worth knowing before you open it. After a donor’s first monthly payment, the ones that followed were only written into your records if you had set up a Stripe webhook — something most masjids never did, because it needs your donation page to be reachable from the internet. Those payments are now picked up by the app itself, each with the date the money actually arrived, so your donations list, your CSV export and your charts include every month. If you have been taking monthly gifts for a while, expect those totals to grow the first time you look: that money did reach your bank, your records simply didn’t know about it. Donation and Zakat pages, tuition, Gift Aid, receipts and thank-you messages are all untouched. Plus everything from v0.37.0 — the tuition page is now laid out child by child: each child has their own line with what they owe or have paid ahead, their own bills beneath it, and their own “Add money” button. That last part matters — money paid ahead now goes to the child you picked, so it lands on their account instead of settling a brother or sister’s older bill. A child with nothing due says so rather than disappearing from a page that only listed debts. Bills also read as a statement until you choose to pay part of one: the tick boxes only appear after you tap “Choose what to pay”, and each bill is its own card with its lines indented under it, so a month reads as one thing. Plus everything from v0.36.0 — a tuition bill can be paid line by line. A February bill is often £200 of monthly tuition plus a £50 book fee, and until now a parent could only pay the whole £250; the page now lists what a bill is made of and they can pay just the book fee. Lines already paid say so, and a bursary shows as the deduction it is — both there for information, neither payable. Everything starts ticked, so paying a whole bill is still one tap, and the running total sits on the pay button. A bill with a single line looks exactly as it did. There is also a new “What’s new” in the account menu (top right): after an update it tells you what changed, and it works with no internet since the notes ship with the app. Needs OpenMasjid Students v0.43.0 for itemised bills; older versions keep paying each bill as one thing. Plus everything from v0.35.0: paying tuition ahead when nothing is due, with any credit on the account shown instead of a bare zero, and a £1/$1 minimum matching the school’s own portal; from v0.34.0: a chosen month lands on the right child’s bill; and from v0.33.0: tuition takes only the child’s Student ID with the name shown back to confirm. Donation and Zakat pages, Gift Aid, receipts and your donation totals are untouched. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: b4e3c668ede58a2413e19f6cf50f81392f2819ec
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.10.1                                 # v0.10.1 — security update, please install. If you had turned on Remote access in OpenMasjidOS AND “Allow remote adoption” in the kiosk, the rule that keeps this app’s admin side on your own network could be stepped around by writing part of the web address a different but equivalent way. Your admin password was still required, so nobody could see donations, donors or plans without it — but the sign-in page itself was reachable from the internet, and it never should have been. That is closed, with a test that keeps it closed. If you use remote adoption, change your kiosk admin password after updating; if you have never turned it on, you were never affected. Also new: an activity record for the actions that reach outside the app — cancelling, pausing or rescheduling someone’s monthly donation, removing a kiosk, changing the exit PIN — so that when two people share the admin login you can still tell who stopped a donor’s standing order, which Stripe alone can never tell you. The typed-card screen can no longer be navigated away to anything but Stripe, so a locked kiosk cannot be turned into a web browser; card authentication with the donor’s bank is unchanged. Pairing a tablet is now protected against guessing from many devices at once, not just one. Underneath: the web-serving library is updated to close four published vulnerabilities, every other known advisory in both halves of the app is cleared, and each build step is pinned to an exact verified version so the app you install is the app we built. Nothing about how the kiosk looks or behaves for a donor changes. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 1c9f3c55a684ff583b41851c76b76b12e9a24374   # immutable pin; the app's compose pins the @sha256 image digest
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.44.0                                 # v0.44.0 — autopay is easier for parents to find, the office can choose who gets emailed about what, and payments say who took them. In the parent portal, saving a card and switching autopay on used to be the very last thing on a long page, below the balance, the children, every bill and the whole payment history — several screens of scrolling on a phone, so most families never found it. There is now a card right under the balance offering to set it up, and a tab of its own for cards and autopay; once it is on, that card says which card will be charged. In Settings there is a new Email alerts section with two halves. What PARENTS are emailed: a receipt every time they pay and a notice when their card is declined, both switchable — and a receipt now goes out however the money arrived, including cash, a check or Zelle you recorded by hand and payments made at the kiosk or on the donation site, none of which told the family anything before. (Invites and password resets always send; they are the only way a parent can reach their account.) And WHO at the masjid hears when something needs a person: add any address — the treasurer, the imām, a trustee — and tick which alerts it gets, from autopay switching itself off or a Student ID being locked after repeated failed lookups, through to every single payment. An address receives only what you ticked and grants no access to the app. Alerts also now name the household and the amount instead of saying “a family”, and they are sent by the app itself, so they no longer depend on a webhook nobody set up. Payments finally say who recorded them: cash is the one payment nobody else can verify, so the office’s list has a Recorded by column naming the person from their staff account, and card payments read “Automatic”. Fixed: an alert for a card payment that was only partly recorded had been silently dropped since 0.43.0. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 66b75e9ad778c4057424a3d7de7541c99ab54a77
  - id: parking-attendant
    repo: SyButter/OpenMasjidParkingAttendant
    ref: v0.2.1                                  # v0.2.1 — one-click install + OpenMasjidOS SSO; live board + incorrect-parking alert cards (with the car's photo) that Display can cycle as announcements; per-plate offender strikes; SQLite on /data
    commit: 2cd04c58cdc25f5714f956ef6bbe517be3d062a5   # immutable pin (the v0.2.1 tag commit)
