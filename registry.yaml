# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:     <app-id>               # kebab-case, must equal the app's manifest id
#     repo:   <owner>/<repo>         # the app's own GitHub repository
#     commit: <40-char SHA>          # RECOMMENDED — an immutable commit SHA pin
#     ref:    v1.0.0                 # a git TAG or branch (MUTABLE — can be moved)
#     path:   subdir                 # OPTIONAL — if manifest.yaml isn't at the repo root
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended daily rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Complete, working reference apps live under examples/ in this repo — copy one
# into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.65.0  # v0.65.0 — Raspberry Pi display nodes: a small Pi plugged into the TV draws the timetable itself and plays cameras straight off the network, so the server does no video work for that screen. Opt-in in Settings; existing RTSP decoder screens are unchanged. commit below is the digest-pin that follows the tag; the app's compose pins the @sha256 image digest.
    commit: a32816bf5e3e3576b4a0bcfb400713b12383e98f
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.33.0                                 # v0.33.0 — paying tuition now takes only the child’s Student ID (e.g. YUS1234): type it in, the page shows the child’s name back and waits for a “yes” before any balance appears, so a mistyped ID is caught instead of opening someone else’s bill. No PIN to remember or reissue. With OpenMasjid Students billing each child separately, the balance page shows what each child owes behind the household total and every open month says whose it is, so paying one month lands on that child’s bill. Needs OpenMasjid Students v0.39.0 or newer for tuition; donation and Zakat pages, Gift Aid, receipts and your donation totals are untouched. Plus everything from v0.32.0: the emailed receipt design on the Thank-you tab, with the on/off toggle and “send me a test” in Settings. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 61cf7a098730077d8a72d814f5d96019a5b8641f
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.9.30                                 # v0.9.30 — much bigger, bolder writing on every screen, so the kiosk reads from across the foyer rather than at arm’s length, with the text colour worked out from the campaign colours you actually chose (light, dark or bright) instead of assumed — subtitles and hints included. The payment screen now says “hold your card on the reader for at least 5 seconds”, which is the most common reason a payment looks like it failed. The on-screen keyboard only opens when someone taps a box, so an optional name or email no longer looks compulsory; empty boxes say “Tap here to type”. Plus everything from v0.9.29: tuition takes the child’s Student ID alone (e.g. YUS1234) and shows the child’s name to confirm before any balance appears — no PIN to remember or reissue — and paying a specific month lands on that child’s bill. Needs OpenMasjid Students v0.39.0 for tuition, and a tablet app update (the new app is on the kiosk’s own setup page). One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: af9fdec0b3d751e5cb04be4839da2549642b788f   # immutable pin; the app's compose pins the @sha256 image digest
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.40.0                                 # v0.40.0 — money paid ahead now settles the months it paid for: hand over $1,400 against a $350/month fee and all four months are marked complete, including months billed later. Parents can pay ahead when nothing is due, and a one-off charge comes out of that advance first — if it leaves a month short, the month goes back to unpaid so it gets chased, and nothing is quietly written off. Students now have ONE Full name field instead of first/last, because plenty of the names a madrasa enrols do not split into two western halves; existing names are joined on upgrade and Student IDs are unchanged. Link siblings on a student’s own record (replacing Move to family) merges their households so one set of guardian details and one balance covers them all. The roster and the whole-year grid are organised Course, then Class, then Student, with course filter buttons. Finance can now open the Students tab read-only. Permanent delete alongside archive for courses, classes, years, fee plans and charge items — anything already billed archives instead and says why. Upload your school logo for printed statements and every email. Light mode is readable again on every tab. CSV import gives each row its own household; link siblings afterwards. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 3df5a9aae13c324250b53ae03a4d0b850ab8e380
  - id: parking-attendant
    repo: SyButter/OpenMasjidParkingAttendant
    ref: v0.2.1                                  # v0.2.1 — one-click install + OpenMasjidOS SSO; live board + incorrect-parking alert cards (with the car's photo) that Display can cycle as announcements; per-plate offender strikes; SQLite on /data
    commit: 2cd04c58cdc25f5714f956ef6bbe517be3d062a5   # immutable pin (the v0.2.1 tag commit)
