# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:      <app-id>              # kebab-case, must equal the app's manifest id
#     repo:    <owner>/<repo>        # the app's own GitHub repository
#     ref:     v1.0.0                # STABLE channel — the published release TAG
#     commit:  <40-char SHA>         # RECOMMENDED — the immutable SHA that tag is at
#     dev_ref: dev                   # OPTIONAL — DEV channel; a branch (moves)
#     path:    subdir                # OPTIONAL — if manifest.yaml isn't at the repo root
#
# TWO CHANNELS, ONE SCHEMA. OpenMasjidOS has an Update Channel setting that swaps the
# branch in the raw URL it fetches, so each branch of this repo publishes its own
# catalog.json: `main` = stable, `dev` = development. This file is identical on both
# branches and carries BOTH addresses per app; the branch being built decides which
# column is used (`ref`/`commit` on main, `dev_ref` on dev). An app with no `dev_ref`
# still appears on the dev channel — it falls back to its stable release, with a
# build notice. A dev ref or a dev-tagged image can never be published on main: the
# build fails loudly. See CLAUDE.md "Channels".
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended hourly rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# `ref:` is the STABLE column and must be a published release tag (or a SHA) — never
# a branch; the build rejects one. `dev_ref:` is the only place a branch belongs, and
# it is a moving ref on purpose: the hourly rebuild follows it, which is the point of
# a dev channel. (It may also be a 40-char SHA if you want to freeze the dev channel.)
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Skeletons showing the shape an app repo needs live under examples/ in this repo —
# illustrative scaffolding, not maintained software; copy one into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.69.0                              # v0.69.0 — tell the congregation an Iqamah time is changing, without leaving the car park. A scheduled Iqamah change can now be turned into an announcement image: a portrait card with your masjid name and logo, the date it takes effect, and the whole timetable for that day with the changing prayers highlighted and the time each one replaces struck through beside it. It follows that timetable's own theme, language and 12/24-hour setting, so it looks like your screens rather than a generic template. Download it for the noticeboard, or have it posted to a WhatsApp group automatically — you choose the group and how far ahead, from a fortnight down to the day itself, and a change added at the last minute goes out within a minute of you saving it. Each change is announced once, with a preview of the exact message beforehand and a log of what was queued. You can also add a scheduled change FROM WhatsApp: message the masjid's number, answer the questions (the date, a numbered list of prayers, the time for each) and send save — nothing is written until you do, and the whole change is read back to you first. Times must say am or pm and dates read month first, always repeated back in words, because a prayer time is the one thing here a whole congregation acts on. WhatsApp needs setting up in OpenMasjidOS first and only people an admin authorised there can use it; messages are queued and paced to protect the masjid's number, so nothing important depends on it and alerts still go by email and webhook. Light mode is also properly light now — it used to lighten the cards but leave the page background dark, so panels sat as grey rectangles on a near-black backdrop; each of the nine wallpapers has a light version that keeps its colour. Plus optional Intel Quick Sync hardware encoding for self-hosted installs, and a security fix: OpenMasjidOS replying with something that was not valid data was read as the platform being down, which is the state that allows claiming the admin account without signing in. Nothing you have set up needs redoing. One-click install; commit below is the immutable pin, and the app's compose pins the @sha256 image digest
    commit: 67bef078ac3ad704a29718a4f3d308fdf47343dc
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.43.0                                 # v0.43.0 — WhatsApp, if your masjid runs it, and every notification setting now in one place. If your masjid has the WhatsApp gateway set up in OpenMasjidOS, Donations can send a message to a number you enter — or to a group your OpenMasjidOS admin has approved — when something happens worth knowing about. Donors are never messaged and the app never asks anyone for a phone number: every number here is one of your own people. It is never switched on for you either, since it sends from your masjid's own number, so that has to be your choice. You can also ask it for figures: message your number with !donations and pick from the menu — what has come in today, this month next to the whole of last month, your overall totals, how a particular appeal is doing against its goal, or how many people give every month. Everything it answers is a total, no donor is ever named, and nothing you can send it changes anything: it reads your figures back, it cannot close an appeal or refund a donation. Who is allowed to use it is set in OpenMasjidOS. All your notification settings have moved into the app as well, under Settings then Notifications: six things you can be told about — a donation arriving, a refund, a monthly donor stopping their gift, donations breaking altogether, a tuition payment that did not reach OpenMasjid Students, and a donation that was found and added — and for each one you choose who hears it: your OpenMasjidOS inbox, a specific email address, a WhatsApp number, or an approved group. Any combination, or none, with a test button on every line, so refunds can reach whoever keeps the accounts while a broken payment setup reaches whoever fixes things. Beside “a donation was received” there is a smallest-amount figure worth setting if you would rather not hear about every small gift, since that is the one notification that happens every single time somebody gives. Light mode also looks like it should now: the page behind the panel used to stay dark when you switched to light, so the panel was pale cards on a near-black background with text that was hard to read, and each of the nine wallpapers now has a light version that keeps its colour. A full security and code-health review went over the whole app including all of the above; it found no new weakness, and what it did find and what is still open are written up in the project's own docs. Nothing you have set up needs redoing, and your donations, appeals and monthly plans are all exactly as they were. Plus everything from v0.42.0 — refund a donation from the panel, all of it or part of it, with a reason and an optional note to the supporter, coming off your totals and charts (a refund made in Stripe's own dashboard finds its way here too); monthly donors emailed their own link to stop their payments, with no account and nobody to ring; each appeal able to pay into its own Stripe account so Zakat can settle separately from the general fund, with nothing changing unless you change it; and branded receipts actually being sent. Plus everything from v0.41.0 — the new square Donations logo, drawn rather than photographed so it stays sharp at every size. Plus everything from v0.40.1 and v0.40.0 — a development channel if you ever want one (stable is the default and is the one to stay on for taking real donations), and a “What's new” that tells you when there is something new. Plus everything from v0.39.0 — donations that were paid but never landed in your records are found and added by themselves, so expect your totals to go up the first time that runs; that is money which already reached your bank. Plus the Monthly tab from v0.38.0, and the tuition improvements from v0.33.0 through v0.37.0. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 298702f653bc8be1e26e4f0ba2db59a2d78d5c0b
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.11.0                                 # v0.11.0 — monthly giving works properly for the first time, and you can now refund a donation from the admin panel. Update your tablets after installing; several of these fixes live in the tablet app. Monthly was the big one: every monthly gift, on every card and every reader, took the money and never set up the standing order, so a donor told their monthly giving was arranged before this release was charged once and nothing recurs. It now works end to end, on the reader and on typed cards, and the donor is emailed when it starts with their own “Stop my monthly donation” link that works from anywhere — press it and you get an alert, and a link for a donation that has already stopped says so rather than offering a button that would do nothing. Refunds: open any donation and give back all or part of it with a reason recorded in Stripe — the donor gets a branded refund note if they left an email, you get an alert, and every total is netted so today, this week, this month and all time show what the masjid actually kept. The card reader now works for appeals that settle to a second Stripe account, which also makes monthly giving possible on them for the first time, and a monthly plan can no longer go missing from the Recurring page. On the tablet: Android Settings, the permission buttons and the self-updater all work on a locked kiosk again (screen pinning is gone — it was silently blocking them), updating the app no longer needs a browser, payments no longer fail to start on a slow connection, the card step can show a pointer to whichever edge your reader is mounted on, and a reader firmware update is shown on the giving screen so an updating reader no longer looks like a broken one. Also: the campaign editor is a full page in its own browser tab, campaign colours accept a typed hex code, campaign tabs have an adjustable size, and monthly plans are no longer set up as a “free trial”. Security: no other site can load this app inside a frame, closing the last item left open by the August security audit. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: b4ef5ade4487d8ab3dc5edd5db4409b125fb460e   # immutable pin; the app's compose pins the @sha256 image digest
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
  - id: openwa
    repo: OpenMasjid-Solutions/OpenMasjidWA
    ref: v0.2.0                                  # v0.2.0 — a WhatsApp number the masjid can send from. This is a transport, not something a volunteer opens day to day: OpenMasjidOS keeps ONE paced send queue for the whole masjid and asks this gateway to send, so the apps that have something to say (the madrasah app first) ask OpenMasjidOS, and nothing else in the masjid talks to WhatsApp directly. No app ever sees this gateway's key. Read the warnings before linking a number, because they are real and they are not ours to soften: this is an UNOFFICIAL WhatsApp client, the linked number CAN be restricted or banned, and a masjid should link a DEDICATED number it can afford to lose — never the masjid's main line. It is also a heavy app. The safer of its two engines works by running a real headless Chromium, which is exactly why WhatsApp finds it harder to tell from a person, and it costs roughly 300-500 MB of memory continuously for as long as the number stays linked; on a 2 GB Raspberry Pi budget for that before installing. The lighter engine (baileys, ~30-80 MB) is offered as a setting and carries a HIGHER ban risk, which the install dialog says plainly. Setting it up is one install, then one detour: OpenWA cannot create OR start a session from configuration and its session id is a UUID it mints itself, so the admin opens this app once, creates a session, presses Start, presses View and copies the full Session ID into OpenMasjidOS > Settings > WhatsApp — after which linking the number, and everything else, happens in OpenMasjidOS. The Start click is not optional and v0.1.1 exists because the first instructions left it out: a created-but-not-started session refuses to link and the only thing the admin sees is "gateway returned 400". Kept on the masjid's own network on purpose: it holds a live, logged-in WhatsApp session, so it is deliberately NOT offered over the internet. This repo is PACKAGING ONLY — the software is OpenWA by rmyndharis (MIT), run unmodified; upstream's own compose cannot be catalogued because it builds from source, mounts the host Docker socket and attaches to pre-existing volumes and networks. v0.2.0 brings the gateway itself up to OpenWA 0.21.0, three upstream releases on, and carries the two fixes the development channel has been running since: the setup steps now include the Start click, without which a session refuses to link and the admin only ever sees "gateway returned 400"; and WhatsApp privacy ids (@lid), which carry no phone number, are resolved back to a number so admin commands can match the sender against the authorised list. Nothing a masjid has set up needs redoing — the linked number, the gateway key and the session all survive an app update. Commit below is the immutable pin, and the compose pins the @sha256 image digest (multi-arch: amd64 + arm64)
    commit: c298082b3044df1242a9bb6a0ce84a3d8d7051a3
    dev_ref: dev                                 # dev channel — a scheduled job follows upstream OpenWA releases onto this branch; stable is promoted by hand
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.51.0                                 # v0.51.0 — You can now ask parents to cover the card processing fee instead of the madrasah absorbing it: every card payment costs you about 2.9% plus 30¢, so a $100 bill has always brought in $96.80 — switch this on and the payer is charged $103.30 and you receive the full $100. It arrives OFF, it never touches cash or checks, bank payments have their own much cheaper rate and their own switch, and the fee is shown to a parent on its own line before they pay, on the autopay tab, and on the printed family sheet, each time saying plainly that the money is the card networks' and not yours. WhatsApp messages now tell you whether they actually arrived rather than stopping at “Queued”, and there are no more quiet hours — a declined card on a Sunday evening reaches a treasurer's phone that evening. The office can record that a parent does not want WhatsApp, because parents say that at pickup and not by signing into a portal. Payment notices to your own notification channel can name the child (off until you turn it on, admin only, and payment notices only). “Which month?” is a dropdown everywhere it is asked, so a typo can no longer put a charge on a month you never bill. A test WhatsApp says which phone it went to. The screens that scroll are faster. And the app writes American English throughout. TWO FIXES WORTH KNOWING: a month you voided can now be billed again — it could not be, so voiding a bill to correct it left that child unbillable for that month for good, and any one-off charge on it quietly stopped being owed. And per-term fee plans are not billed by this app: the cadence can be chosen but invoices are generated by month, so if you have per-term plans configured, check whether you have been invoicing them — the app now says so on the fee-plan form and leaves those fees out of the year figure instead of quoting money it will not collect. ALSO: a family who always pays by cash or transfer can be recorded automatically on a day you choose; a full-year fee quote per child; a mid-year joiner's first month set to whatever you agreed; erasing a billed student for good behind a door that asks for their name; one onboarding message that explains what the portal is; and a Billing button on every child in a family's record. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: 6cc56db3f2383723fa25f2d4132f31284148c96c   # immutable pin; the app compose pins the @sha256 image digest
    dev_ref: dev                                 # dev channel — tracks the app's dev branch (:dev image)
