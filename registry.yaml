# OpenMasjidAPPS registry
# ---------------------------------------------------------------------------
# This is the ONLY hand-edited source of truth for the catalog. Each app lives
# in its OWN public repository; this file just lists them. The build script
# (scripts/build-catalog.mjs) fetches each repo's manifest.yaml +
# docker-compose.yml (+ icon/screenshots) and assembles catalog.json — the file
# OpenMasjidOS actually fetches.
#
# To list an app, open a PR adding an entry below. Each entry:
#
#   - id:     <app-id>               # kebab-case, must equal the app's manifest id
#     repo:   <owner>/<repo>         # the app's own GitHub repository
#     commit: <40-char SHA>          # RECOMMENDED — an immutable commit SHA pin
#     ref:    v1.0.0                 # a git TAG or branch (MUTABLE — can be moved)
#     path:   subdir                 # OPTIONAL — if manifest.yaml isn't at the repo root
#
# Pin to a `commit:` (a full 40-char hex commit SHA) for security. Tags and
# branches are MUTABLE — a compromised or turned-malicious app-repo owner can move
# the ref to backdoored content, and the unattended daily rebuild republishes it to
# the catalog.json every install fetches. A commit SHA cannot be moved, so it is the
# only immutable pin. `commit:` (or an equivalent `sha:`) takes precedence over
# `ref:`; a `ref:` that is itself a 40-char SHA is also treated as immutable. If you
# only set a mutable `ref:`, the build prints a ⚠ warning naming the entry (and, when
# the GitHub API is reachable, the SHA it currently resolves to — copy it here).
#
# Requirements an app repo must meet are in CLAUDE.md and docs/BUILDING_AN_APP.md.
# Complete, working reference apps live under examples/ in this repo — copy one
# into a new repo to start.
# ---------------------------------------------------------------------------

apps:
  - id: display
    repo: OpenMasjid-Solutions/OpenMasjidDisplay
    ref: v0.65.0  # v0.65.0 — Raspberry Pi display nodes: a small Pi plugged into the TV draws the timetable itself and plays cameras straight off the network, so the server does no video work for that screen. Opt-in in Settings; existing RTSP decoder screens are unchanged. commit below is the digest-pin that follows the tag; the app's compose pins the @sha256 image digest.
    commit: a32816bf5e3e3576b4a0bcfb400713b12383e98f
  - id: donations
    repo: OpenMasjid-Solutions/OpenMasjidDonations
    ref: v0.36.0                                 # v0.36.0 — a tuition bill can now be paid line by line. A February bill is often £200 of monthly tuition plus a £50 book fee, and until now a parent could only pay the whole £250; the page now lists what a bill is made of and they can pay just the book fee. Lines already paid say so, and a bursary shows as the deduction it is — both there for information, neither payable. Everything starts ticked, so paying a whole bill is still one tap, and the running total sits on the pay button. A bill with a single line looks exactly as it did. There is also a new “What’s new” in the account menu (top right): after an update it tells you what changed, and it works with no internet since the notes ship with the app. Needs OpenMasjid Students v0.43.0 for itemised bills; older versions keep paying each bill as one thing. Plus everything from v0.35.0: paying tuition ahead when nothing is due, with any credit on the account shown instead of a bare zero, and a £1/$1 minimum matching the school’s own portal; from v0.34.0: a chosen month lands on the right child’s bill; and from v0.33.0: tuition takes only the child’s Student ID with the name shown back to confirm. Donation and Zakat pages, Gift Aid, receipts and your donation totals are untouched. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: bd0b3313fae408f3eb16444d44c3dcaeffbd7d3b
  - id: kiosk
    repo: OpenMasjid-Solutions/OpenMasjidKiosk
    ref: v0.9.34                                 # v0.9.34 — the tuition screen is now laid out child by child. A family with three children used to get one condensed list where every row said “Tuition — Feb 2027” and nothing said who owed what; each child now has their own section with their name, their own balance due, credit or “Nothing due”, and their own bills underneath. Where there is more than one child, “pay a different amount” becomes a button per child — “Add money for Maryam” — so the money lands on that child’s account, which means paying ahead for one child while another still owes now works properly. A parent who owes nothing is no longer dropped straight onto a number pad, which read as being asked for money: the kiosk says what the account is first and offers to take a payment only if they want to. And a bill can now be paid one part at a time — a February bill is often £200 of tuition plus a £50 book fee, and with OpenMasjid Students v0.43.0 the kiosk lists what a bill is made of and lets a parent tick just the lines they want, with the school’s ledger settling exactly those lines rather than the oldest bill instead; lines already paid show as done and a bursary shows for information. “Full balance” is still the default and still one tap, the smallest payment is still £1/$1, and on an older Students nothing changes — a bill stays one line with one tick. Needs a tablet app update — the new app is on the kiosk’s own setup page. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: d2b6d8aeed967259ad722d16ae2b69db4fb43598   # immutable pin; the app's compose pins the @sha256 image digest
  - id: students
    repo: OpenMasjid-Solutions/OpenMasjidStudents
    ref: v0.43.1                                 # v0.43.1 — fixes the student search list on the Billing tab: it was see-through, so the page behind it read straight through the names, and its bottom disappeared under the next section. Everything in 0.43.0 is included: a bill now shows what it is made of and a parent can pay one part of it (tuition and a one-off charge like a book fee are listed separately on the parent portal, at the kiosk and on the donation site, and the money is recorded against the line they chose); recording a payment moved to the top of the Billing tab behind a search box for the child, and pressing a child’s name in the Year view opens their billing; a new “Starting mid-year” step records what each child already owes or has paid, in one pass, without re-billing months you collected in cash; parents are told plainly that they sign in with their email address. Also fixed there: autopay could charge a card more than the household owed when a credit was larger than one month’s bill, a bill fully covered by a scholarship read Open forever, and a month typed 2027-2 billed February twice. One-click install; commit below is the immutable pin, and the app compose pins the @sha256 image digest
    commit: c8fbae78845ff249ab7fded0ac682ab67b9cfee7
  - id: parking-attendant
    repo: SyButter/OpenMasjidParkingAttendant
    ref: v0.2.1                                  # v0.2.1 — one-click install + OpenMasjidOS SSO; live board + incorrect-parking alert cards (with the car's photo) that Display can cycle as announcements; per-plate offender strikes; SQLite on /data
    commit: 2cd04c58cdc25f5714f956ef6bbe517be3d062a5   # immutable pin (the v0.2.1 tag commit)
  # Example (uncomment and adapt once the app repo exists):
  # - id: prayer-times-display
  #   repo: OpenMasjid-Solutions/openmasjid-prayer-times-display
  #   ref: v1.0.0
